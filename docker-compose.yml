version: "3.9"


services:

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  # для истории чатов
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
        POSTGRES_USER: raguser
        POSTGRES_PASSWORD: ragpassword
        POSTGRES_DB: ragdb
    volumes:
      - ./postgres_storage:/var/lib/postgresql/data

  # Кэш для быстрых ответов на повторные вопросы
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./redis_storage:/data