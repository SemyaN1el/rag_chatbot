[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Local RAG chatbot for working with a single PDF document."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.3.3",
    "redis==7.3.0",
    "langchain-core==1.2.19",
    "langchain-community==0.4.1",
    "langchain-classic==1.0.3",
    "langchain-huggingface==1.2.1",
    "langchain-ollama==1.0.1",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.1.1",
    "qdrant-client==1.17.1",
    "sentence-transformers==5.1.1",
    "pypdf==6.9.0",
    "rank-bm25==0.2.2",
    "datasets==4.3.0",
    "ragas==0.4.3",
]

[tool.setuptools]
py-modules = ["chat", "config", "evaluate", "hybrid_chat", "hybrid_search", "ingest"]
packages = ["app", "app.agent", "app.routers", "app.services"]
